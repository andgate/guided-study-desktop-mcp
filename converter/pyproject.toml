[project]
name = "guided-study-converter"
version = "0.1.0"
description = "PDF conversion helper for the guided-study desktop MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf==1.28.2",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
]

[tool.uv]
package = false
required-version = ">=0.12.5"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
