interface:
  display_name: "Noggin"
  short_description: "Study books actively or create flashcard decks"
  default_prompt: "Use $noggin to continue my active study session."

dependencies:
  tools:
    - type: "mcp"
      value: "guided_study"
      description: "Local Guided Study book, progress, and flashcard service"
      transport: "streamable_http"
      url: "http://127.0.0.1:7331/mcp"

policy:
  allow_implicit_invocation: true
