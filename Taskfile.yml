version: '3'

vars:
  MCP_SERVER_URL: http://127.0.0.1:7331/mcp
  TUNNEL_CLIENT: '{{.LOCALAPPDATA}}\Programs\tunnel-client\tunnel-client.exe'
  TUNNEL_PROFILE: guided-study

tasks:
  build:
    desc: Build the Windows desktop application and bundled PDF converter
    platforms: [windows]
    cmds:
      - mkdir -p bin
      - uv run --project converter --locked pyinstaller --noconfirm --clean --onefile --distpath bin --workpath .cache/pyinstaller --specpath .cache/pyinstaller --name pdf-converter converter/prepare_book.py
      - go build -v -trimpath -ldflags="-H=windowsgui -s -w" -o bin/guided-study.exe ./cmd/guided-study

  clean:
    desc: Remove temporary files, build artifacts, and the Go build cache
    platforms: [windows]
    cmds:
      - powershell -NoProfile -Command '$root = (Get-Location).Path; foreach ($name in @("bin", "dist", ".cache")) { $target = [IO.Path]::GetFullPath((Join-Path $root $name)); if ([IO.Path]::GetDirectoryName($target) -ne $root) { throw "Unsafe clean target $target" }; if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force } }'
      - go clean

  skill:zip:
    desc: Zip Noggin for skill upload
    platforms: [windows]
    vars:
      SOURCE: noggin-plugin/skills/noggin
      ARCHIVE: dist/noggin.zip
    cmds:
      - >-
        powershell -NoProfile -Command
        '$skill = (Resolve-Path -LiteralPath "{{.SOURCE}}").Path;
        $archive = [IO.Path]::GetFullPath("{{.ARCHIVE}}");
        New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($archive)) -Force | Out-Null;
        Compress-Archive -Path (Join-Path $skill "*") -DestinationPath $archive -Force'

  tunnel:init:
    desc: Create the tunnel profile
    platforms: [windows]
    dotenv: ['.env.local']
    preconditions:
      - sh: powershell -NoProfile -Command 'if (-not (Test-Path -LiteralPath "{{.TUNNEL_CLIENT}}")) { exit 1 }'
        msg: Install tunnel-client for this user.
      - sh: powershell -NoProfile -Command 'if ([string]::IsNullOrWhiteSpace($env:CONTROL_PLANE_TUNNEL_ID)) { exit 1 }'
        msg: Set CONTROL_PLANE_TUNNEL_ID in .env.local.
    cmds:
      - >-
        powershell -NoProfile -Command
        '& "{{.TUNNEL_CLIENT}}" init
        --sample sample_mcp_remote_no_auth
        --profile "{{.TUNNEL_PROFILE}}"
        --tunnel-id $env:CONTROL_PLANE_TUNNEL_ID
        --mcp-server-url "{{.MCP_SERVER_URL}}"'

  tunnel:doctor:
    desc: Check the tunnel profile
    platforms: [windows]
    dotenv: ['.env.local']
    preconditions:
      - sh: powershell -NoProfile -Command 'if (-not (Test-Path -LiteralPath "{{.TUNNEL_CLIENT}}")) { exit 1 }'
        msg: Install tunnel-client for this user.
      - sh: powershell -NoProfile -Command 'if ([string]::IsNullOrWhiteSpace($env:CONTROL_PLANE_API_KEY)) { exit 1 }'
        msg: Set CONTROL_PLANE_API_KEY in .env.local.
    cmds:
      - >-
        powershell -NoProfile -Command
        '& "{{.TUNNEL_CLIENT}}" doctor
        --profile "{{.TUNNEL_PROFILE}}"
        --explain'

  tunnel:run:
    desc: Run the private MCP tunnel
    platforms: [windows]
    dotenv: ['.env.local']
    preconditions:
      - sh: powershell -NoProfile -Command 'if (-not (Test-Path -LiteralPath "{{.TUNNEL_CLIENT}}")) { exit 1 }'
        msg: Install tunnel-client for this user.
      - sh: powershell -NoProfile -Command 'if ([string]::IsNullOrWhiteSpace($env:CONTROL_PLANE_API_KEY)) { exit 1 }'
        msg: Set CONTROL_PLANE_API_KEY in .env.local.
    cmds:
      - >-
        powershell -NoProfile -Command
        '& "{{.TUNNEL_CLIENT}}" run
        --profile "{{.TUNNEL_PROFILE}}"'

  test:
    desc: Run the Go and Python tests
    cmds:
      - go test -x -v ./internal/...
      - uv run --project converter --locked python -m unittest discover -s converter -p "test_*.py" -v

  format:
    desc: Format Go and Python source files
    cmds:
      - go fmt ./...
      - uv run --project converter --locked ruff format converter

  format:check:
    desc: Check Go and Python formatting without changing files
    cmds:
      - powershell -NoProfile -Command '$unformatted = gofmt -l (Get-ChildItem cmd,internal -Recurse -Filter *.go).FullName; if ($unformatted) { $unformatted; exit 1 }'
      - uv run --project converter --locked ruff format --check converter
